<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abrindo no YouTube...</title><meta name="robots" content="noindex">
<style>body{margin:0;background:#000;color:#fff;font-family:Inter,system-ui,Arial,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center}
a{display:inline-block;margin-top:18px;padding:14px 22px;background:#96BF48;color:#111;font-weight:700;border-radius:10px;text-decoration:none}</style></head>
<body><div><p>Abrindo o vídeo no YouTube...</p><a id="b" href="#">Abrir no YouTube</a></div>
<script>
(function(){
  var v=(new URLSearchParams(location.search).get('v')||'').replace(/[^A-Za-z0-9_-]/g,'');
  var web='https://www.youtube.com/watch?v='+v; var ua=navigator.userAgent||'';
  document.getElementById('b').href=web;
  if(!v){return;}
  var deep=null;
  if(/iPhone|iPad|iPod/i.test(ua)) deep='youtube://www.youtube.com/watch?v='+v;
  else if(/Android/i.test(ua)) deep='intent://www.youtube.com/watch?v='+v+'#Intent;scheme=https;package=com.google.android.youtube;S.browser_fallback_url='+encodeURIComponent(web)+';end';
  if(deep){ location.href=deep; setTimeout(function(){ location.href=web; },1500); }
  else { location.replace(web); }
})();
</script></body></html>
